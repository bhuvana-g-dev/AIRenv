name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. bandit security, complexity and pylint rules)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Lint (type-aware ESLint incl. jsx-a11y)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit, component and axe accessibility tests
        run: npm test
      - run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
